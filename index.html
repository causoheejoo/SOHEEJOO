<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자기 전 영화 고르기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #181825;
    --border: #2a2a3a;
    --accent: #c8a96e;
    --accent2: #7c9cbf;
    --text: #e8e0d4;
    --text-dim: #8a8099;
    --text-faint: #3d3850;
    --star: #d4a847;
    --danger: #b05555;
    --success: #5a8f6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(100,80,160,0.12), transparent),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(60,100,140,0.08), transparent);
    pointer-events: none;
  }

  .app {
    width: 100%;
    max-width: 560px;
    position: relative;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .header-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .header h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: 0.05em;
    line-height: 1.3;
  }

  .header h1 span {
    color: var(--accent);
  }

  /* Steps */
  .step {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .step.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }

  .step-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 6px;
  }

  .step-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 28px;
    line-height: 1.6;
  }

  /* Time inputs */
  .time-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .input-group label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .time-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 22px;
    text-align: center;
    letter-spacing: 0.05em;
    outline: none;
    transition: border-color 0.2s;
  }

  .time-input:focus {
    border-color: var(--accent);
  }

  .allowed-time {
    text-align: center;
    padding: 16px;
    background: var(--surface2);
    border-radius: 10px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .allowed-time strong {
    display: block;
    font-size: 28px;
    color: var(--accent);
    font-family: 'Noto Serif KR', serif;
    font-weight: 300;
    margin-bottom: 2px;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-primary {
    background: var(--accent);
    color: #1a1208;
  }
  .btn-primary:hover { background: #d9be85; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--text-faint); color: var(--text-dim); cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    margin-top: 10px;
  }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--text); }

  /* Fatigue options */
  .option-grid {
    display: grid;
    gap: 12px;
    margin-bottom: 24px;
  }

  .option-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
  }

  .option-btn:hover {
    border-color: var(--accent);
    background: rgba(200,169,110,0.07);
  }

  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(200,169,110,0.12);
  }

  .option-btn .opt-title {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .option-btn .opt-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  /* Mood options */
  .mood-grid {
    display: grid;
    gap: 12px;
    margin-bottom: 24px;
  }

  .mood-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
  }

  .mood-btn:hover { border-color: var(--accent2); background: rgba(124,156,191,0.07); }
  .mood-btn.selected { border-color: var(--accent2); background: rgba(124,156,191,0.12); }

  .mood-btn .mood-emoji { font-size: 20px; margin-bottom: 6px; }
  .mood-btn .mood-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .mood-btn .mood-sub { font-size: 12px; color: var(--text-dim); }

  /* Movie card */
  .movie-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .movie-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .movie-num {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .movie-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.3;
  }

  .movie-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    align-items: center;
  }

  .meta-tag {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .meta-time {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }

  .meta-stars {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }

  .star-val { color: var(--star); font-weight: 600; }
  .star-label { color: var(--text-dim); font-size: 11px; }

  .movie-genre {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .movie-tags {
    font-size: 12px;
    color: var(--accent2);
    margin-bottom: 20px;
  }

  .movie-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-pick {
    background: var(--accent);
    color: #1a1208;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-pick:hover { background: #d9be85; transform: translateY(-1px); }

  .btn-skip {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-skip:hover { border-color: var(--text-dim); color: var(--text); }

  /* Result */
  .result-icon {
    font-size: 48px;
    text-align: center;
    margin-bottom: 16px;
  }

  .result-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 8px;
  }

  .result-movie {
    font-family: 'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--accent);
    text-align: center;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .result-sub {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .result-meta {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .result-meta-item {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  .result-meta-item span {
    display: block;
    font-size: 16px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .watched-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .watched-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .watched-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .watched-item {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    color: var(--text-dim);
    border: 1px solid var(--text-faint);
  }

  .no-movies {
    text-align: center;
    padding: 20px;
  }

  .no-movies .no-icon { font-size: 40px; margin-bottom: 12px; }
  .no-movies p { font-size: 14px; color: var(--text-dim); line-height: 1.6; margin-bottom: 8px; }

  /* Progress dots */
  .progress {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 32px;
  }

  .progress-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: all 0.3s;
  }

  .progress-dot.active {
    background: var(--accent);
    width: 20px;
    border-radius: 3px;
  }

  .progress-dot.done { background: var(--text-dim); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .candidate-header {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 16px;
    letter-spacing: 0.05em;
  }

  .candidate-header strong {
    color: var(--accent);
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .time-grid { grid-template-columns: 1fr; }
    .card { padding: 24px 20px; }
    .movie-actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-label">Tonight's Pick</div>
    <h1>자기 전<br><span>영화 고르기</span></h1>
  </div>

  <!-- Progress -->
  <div class="progress">
    <div class="progress-dot active" id="dot0"></div>
    <div class="progress-dot" id="dot1"></div>
    <div class="progress-dot" id="dot2"></div>
    <div class="progress-dot" id="dot3"></div>
  </div>

  <!-- Step 1: 시간 입력 -->
  <div class="step active" id="step-time">
    <div class="card">
      <div class="step-title">지금 몇 시예요?</div>
      <div class="step-sub">현재 시각과 잠들고 싶은 시각을 입력해 주세요.<br>허용 러닝타임을 계산할게요.</div>
      <div class="time-grid">
        <div class="input-group">
          <label>지금 시각</label>
          <input class="time-input" type="time" id="current-time">
        </div>
        <div class="input-group">
          <label>취침 목표</label>
          <input class="time-input" type="time" id="sleep-time">
        </div>
      </div>
      <div class="allowed-time" id="allowed-display" style="display:none">
        <strong id="allowed-val">—</strong>
        허용 러닝타임
      </div>
      <button class="btn btn-primary" id="btn-time-next" disabled>다음으로</button>
    </div>
  </div>

  <!-- Step 2: 피로도 -->
  <div class="step" id="step-fatigue">
    <div class="card">
      <div class="step-title">오늘 컨디션은요?</div>
      <div class="step-sub">피곤하면 잔잔한 영화와 애니메이션은 제외하고<br>더 가벼운 후보들로 걸러드려요.</div>
      <div class="option-grid">
        <button class="option-btn" onclick="selectFatigue('tired')">
          <div class="opt-title">😴 피곤해요</div>
          <div class="opt-desc">잔잔하고 자극적이지 않은 영화, 애니메이션 제외</div>
        </button>
        <button class="option-btn" onclick="selectFatigue('fine')">
          <div class="opt-title">😊 멀쩡해요</div>
          <div class="opt-desc">모든 영화 허용</div>
        </button>
      </div>
    </div>
  </div>

  <!-- Step 3: 기분 -->
  <div class="step" id="step-mood">
    <div class="card">
      <div class="step-title">오늘 밤 어떤 기분?</div>
      <div class="step-sub">보고 싶은 영화의 분위기를 골라 주세요.</div>
      <div class="mood-grid">
        <button class="mood-btn" onclick="selectMood('intense')">
          <div class="mood-emoji">🔥</div>
          <div class="mood-title">화려하고 강렬한</div>
          <div class="mood-sub">강한 인상을 남기는 작품</div>
        </button>
        <button class="mood-btn" onclick="selectMood('warm')">
          <div class="mood-emoji">🌙</div>
          <div class="mood-title">따뜻하고 감성적인</div>
          <div class="mood-sub">마음이 움직이는 작품</div>
        </button>
        <button class="mood-btn" onclick="selectMood('heavy')">
          <div class="mood-emoji">🌊</div>
          <div class="mood-title">묵직하고 사유하는</div>
          <div class="mood-sub">오래 생각하게 만드는 작품</div>
        </button>
        <button class="mood-btn" onclick="selectMood('tense')">
          <div class="mood-emoji">⚡</div>
          <div class="mood-title">긴장하며 빠져드는</div>
          <div class="mood-sub">몰입해서 보게 되는 작품</div>
        </button>
      </div>
    </div>
  </div>

  <!-- Step 4: 후보 선택 -->
  <div class="step" id="step-pick">
    <div class="card">
      <div class="step-title">오늘의 후보작</div>
      <div class="candidate-header" id="candidate-header"></div>
      <div id="movie-slot"></div>
      <div id="no-movies-slot"></div>
    </div>
  </div>

  <!-- Step 5: 결과 -->
  <div class="step" id="step-result">
    <div class="card">
      <div id="result-content"></div>
      <div class="watched-section" id="watched-section">
        <div class="watched-title">이미 본 영화 목록</div>
        <div class="watched-list" id="watched-list"></div>
      </div>
      <div class="divider"></div>
      <button class="btn btn-primary" onclick="restart()">다시 고르기</button>
      <button class="btn btn-secondary" onclick="clearWatched()">기록 초기화</button>
    </div>
  </div>
</div>

  { id:8,  title:"글래디에이터",       runtime:154, expected:3.6, avg:4.1, tags:"#ost #명작",     genre:"드라마/모험/액션",             platform:"왓챠·넷플릭스·쿠팡플레이",    isAnime:false, isCalm:false, moods:["intense"] },
  { id:9,  title:"주토피아 2",         runtime:108, expected:3.6, avg:3.8, tags:"",               genre:"애니메이션/가족/모험/코미디",   platform:"디즈니+",                    isAnime:true,  isCalm:false, moods:["warm"] },
  { id:10, title:"용서받지 못한 자",   runtime:121, expected:3.8, avg:3.7, tags:"#웃긴 #인생",    genre:"드라마",                      platform:"왓챠·넷플릭스·웨이브",        isAnime:false, isCalm:false, moods:["heavy"] },

const CALM_MOVIE_IDS = [31, 25, 14, 12, 23]; // 빅 피쉬, 아무도 모른다, 사랑과 영혼, 맨체스터, 존 오브 인터레스트

// ===== 상태 =====
let state = {
  allowedMinutes: 0,
  fatigue: null,
  mood: null,
  candidates: [],
  currentCandidateIndex: 0,
  watchedIds: [],
};

// ===== 로컬스토리지 =====
function loadWatched() {
  try {
    const stored = localStorage.getItem('watched_movies');
    return stored ? JSON.parse(stored) : [];
  } catch { return []; }
}

function saveWatched(ids) {
  try { localStorage.setItem('watched_movies', JSON.stringify(ids)); } catch {}
}

function clearWatched() {
  if (confirm('이미 본 영화 기록을 모두 초기화할까요?')) {
    localStorage.removeItem('watched_movies');
    state.watchedIds = [];
    renderWatchedList();
  }
}

// ===== 시간 계산 =====
function updateAllowedTime() {
  const cur = document.getElementById('current-time').value;
  const slp = document.getElementById('sleep-time').value;
  const btn = document.getElementById('btn-time-next');
  const display = document.getElementById('allowed-display');
  const val = document.getElementById('allowed-val');

  if (!cur || !slp) { btn.disabled = true; display.style.display = 'none'; return; }

  const [ch, cm] = cur.split(':').map(Number);
  const [sh, sm] = slp.split(':').map(Number);
  let diff = (sh * 60 + sm) - (ch * 60 + cm);
  if (diff <= 0) diff += 24 * 60;

  state.allowedMinutes = diff;
  display.style.display = 'block';

  if (diff <= 0) {
    val.textContent = '—';
    btn.disabled = true;
  } else {
    const h = Math.floor(diff / 60);
    const m = diff % 60;
    val.textContent = h > 0 ? `${h}시간 ${m}분` : `${m}분`;
    btn.disabled = false;
  }
}

document.getElementById('current-time').addEventListener('input', updateAllowedTime);
document.getElementById('sleep-time').addEventListener('input', updateAllowedTime);

// ===== 단계 전환 =====
let currentStep = 0;
const steps = ['step-time','step-fatigue','step-mood','step-pick','step-result'];

function goStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(steps[n]).classList.add('active');
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot'+i);
    dot.classList.toggle('active', i === n);
    dot.classList.toggle('done', i < n);
  }
  currentStep = n;
}

document.getElementById('btn-time-next').addEventListener('click', () => goStep(1));

// ===== 피로도 선택 =====
function selectFatigue(val) {
  state.fatigue = val;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  setTimeout(() => goStep(2), 300);
}

// ===== 기분 선택 =====
function selectMood(val) {
  state.mood = val;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  setTimeout(() => {
    buildCandidates();
    goStep(3);
    renderCurrentCandidate();
  }, 300);
}

// ===== 후보 구성 =====
function buildCandidates() {
  state.watchedIds = loadWatched();

  let pool = MOVIES.filter(m => {
    // 이미 본 영화 제외
    if (state.watchedIds.includes(m.id)) return false;
    // 러닝타임 조건
    if (m.runtime > state.allowedMinutes) return false;
    // 피로도 조건
    if (state.fatigue === 'tired') {
      if (m.isAnime) return false;
      if (CALM_MOVIE_IDS.includes(m.id)) return false;
    }
    // 기분 조건
    if (!m.moods.includes(state.mood)) return false;
    return true;
  });

  // 예상 별점 내림차순
  pool.sort((a, b) => b.expected - a.expected);
  state.candidates = pool.slice(0, 3);
  state.currentCandidateIndex = 0;
}

// ===== 후보 렌더링 =====
const moodLabels = {
  intense: '화려하고 강렬한',
  warm: '따뜻하고 감성적인',
  heavy: '묵직하고 사유하는',
  tense: '긴장하며 빠져드는',
};

function renderCurrentCandidate() {
  const slot = document.getElementById('movie-slot');
  const noSlot = document.getElementById('no-movies-slot');
  const header = document.getElementById('candidate-header');

  if (state.candidates.length === 0) {
    slot.innerHTML = '';
    noSlot.innerHTML = `
      <div class="no-movies">
        <div class="no-icon">🌙</div>
        <p>조건에 맞는 영화가 없어요.<br>시간을 더 확보하거나 기분을 바꿔 다시 시도해보세요.</p>
      </div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="restart()">처음부터 다시</button>
    `;
    header.innerHTML = '';
    return;
  }

  const i = state.currentCandidateIndex;

  if (i >= state.candidates.length) {
    // 3편 모두 패스 → 기본값(1번 후보)으로 자동 결정
    const defaultMovie = state.candidates[0];
    finishWithMovie(defaultMovie, true);
    return;
  }

  const m = state.candidates[i];
  const total = state.candidates.length;

  header.innerHTML = `<strong>${i + 1} / ${total}</strong>번째 후보 · "${moodLabels[state.mood]}" 기준`;

  slot.innerHTML = `
    <div class="movie-card">
      <div class="movie-num">후보 ${i + 1}</div>
      <div class="movie-title">${m.title}</div>
      <div class="movie-meta">
        <span class="meta-time">⏱ ${m.runtime}분</span>
        <div class="meta-stars">
          <span class="star-val">★ ${m.expected.toFixed(1)}</span>
          <span class="star-label">예상</span>
        </div>
        <div class="meta-stars">
          <span class="star-val">★ ${m.avg.toFixed(1)}</span>
          <span class="star-label">왓챠 평균</span>
        </div>
      </div>
      <div class="movie-genre">${m.genre}</div>
      ${m.tags ? `<div class="movie-tags">${m.tags}</div>` : ''}
      <div class="movie-meta" style="margin-bottom:20px"><span class="meta-tag">${m.platform}</span></div>
      <div class="movie-actions">
        <button class="btn-pick" onclick="pickMovie(${m.id})">🎬 이걸로 볼게요</button>
        <button class="btn-skip" onclick="skipMovie()">다음 후보 →</button>
      </div>
    </div>
  `;
  noSlot.innerHTML = '';
}

function skipMovie() {
  state.currentCandidateIndex++;
  renderCurrentCandidate();
}

function pickMovie(id) {
  const movie = MOVIES.find(m => m.id === id);
  finishWithMovie(movie, false);
}

function finishWithMovie(movie, isDefault) {
  // 시청 기록 저장
  const watched = loadWatched();
  if (!watched.includes(movie.id)) {
    watched.push(movie.id);
    saveWatched(watched);
  }
  state.watchedIds = watched;
  renderResult(movie, isDefault);
  goStep(4);
}

// ===== 결과 렌더링 =====
function renderResult(movie, isDefault) {
  const content = document.getElementById('result-content');
  content.innerHTML = `
    <div class="result-icon">${isDefault ? '🌙' : '🎬'}</div>
    <div class="result-title">${isDefault ? '자동으로 선택된 오늘의 영화' : '오늘 밤의 선택'}</div>
    <div class="result-movie">${movie.title}</div>
    <div class="result-sub">${isDefault ? '3편을 모두 건너뛰어 1번 후보로 자동 결정되었어요.' : '좋은 선택이에요! 편안한 감상 되세요 🌙'}</div>
    <div class="result-meta">
      <div class="result-meta-item"><span>⏱ ${movie.runtime}분</span>러닝타임</div>
      <div class="result-meta-item"><span>★ ${movie.expected.toFixed(1)}</span>예상 별점</div>
      <div class="result-meta-item"><span>★ ${movie.avg.toFixed(1)}</span>왓챠 평균</div>
    </div>
    <div class="meta-tag" style="display:inline-block;margin-bottom:4px">${movie.platform}</div>
  `;
  renderWatchedList();
}

function renderWatchedList() {
  const watched = loadWatched();
  const list = document.getElementById('watched-list');
  if (watched.length === 0) {
    list.innerHTML = '<span style="font-size:13px;color:var(--text-faint)">없음</span>';
    return;
  }
  list.innerHTML = watched
    .map(id => MOVIES.find(m => m.id === id))
    .filter(Boolean)
    .map(m => `<div class="watched-item">${m.title}</div>`)
    .join('');
}

// ===== 재시작 =====
function restart() {
  state.allowedMinutes = 0;
  state.fatigue = null;
  state.mood = null;
  state.candidates = [];
  state.currentCandidateIndex = 0;
  document.getElementById('current-time').value = '';
  document.getElementById('sleep-time').value = '';
  document.getElementById('allowed-display').style.display = 'none';
  document.getElementById('btn-time-next').disabled = true;
  goStep(0);
}

// 초기 시각 자동 입력
(function() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('current-time').value = `${hh}:${mm}`;
  updateAllowedTime();
})();
</script>
